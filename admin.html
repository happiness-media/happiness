<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happiness Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-right: 7px;
      margin-bottom: 7px;
    }

    .primary {
      background: #16803c;
      color: white;
    }

    .danger {
      background: #d93025;
      color: white;
    }

    .secondary {
      background: #e8edf3;
      color: #222;
    }

    .hidden {
      display: none;
    }

    .content-item {
      border: 1px solid #ddd;
      padding: 18px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .content-item img,
    .content-item video {
      max-width: 100%;
      max-height: 300px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #eef5ff;
    }

    .error {
      background: #ffecec;
      color: #a40000;
    }

    .success {
      background: #eaffef;
      color: #08752c;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h1>🔐 Happiness Admin</h1>

    <p>Admin account দিয়ে login করুন।</p>

    <div id="loginMessage"></div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="আপনার email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="hidden">

    <div class="card">

      <div class="topbar">

        <div>
          <h1>🎛️ Happiness Admin Panel</h1>
          <div id="userEmail"></div>
        </div>

        <button class="danger" onclick="logout()">
          Logout
        </button>

      </div>

    </div>


    <!-- ADD CONTENT -->
    <div class="card">

      <h2>➕ নতুন Content যোগ করুন</h2>

      <div id="uploadMessage"></div>

      <label>Title</label>

      <input
        id="title"
        type="text"
        placeholder="গল্প/ছবি/ভিডিওর title"
      >


      <label>Type</label>

      <select id="type">

        <option value="story">
          📖 Story
        </option>

        <option value="image">
          🖼️ Image
        </option>

        <option value="video">
          🎬 Video
        </option>

      </select>


      <label>Story / Description</label>

      <textarea
        id="body"
        placeholder="গল্প বা description লিখুন..."
      ></textarea>


      <label>ছবি / ভিডিও নির্বাচন করুন</label>

      <input
        id="mediaFile"
        type="file"
        accept="image/*,video/*"
      >


      <button
        class="primary"
        onclick="addContent()"
      >
        🚀 Publish
      </button>

    </div>


    <!-- CONTENT LIST -->
    <div class="card">

      <div class="topbar">

        <h2>📚 Website Content</h2>

        <button
          class="secondary"
          onclick="loadContent()"
        >
          🔄 Refresh
        </button>

      </div>

      <div id="contentList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

  /*
   =====================================================
   SUPABASE CONFIG
   =====================================================

   এখানে শুধু আপনার Publishable key ব্যবহার করবেন।

   Secret key (sb_secret_...) কখনো এখানে দেবেন না।
  */

  const SUPABASE_URL =
    "https://oiniltywzwbaqofwpthh.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_4BCNssgCe-383Hzv9sWwFg_W-UkPxQs";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /*
   =====================================================
   LOGIN
   =====================================================
  */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email এবং password দিন।",
        "error"
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message,
        "error"
      );

      return;
    }


    showAdmin(data.user);

  }


  /*
   =====================================================
   LOGOUT
   =====================================================
  */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

  }


  /*
   =====================================================
   SHOW ADMIN
   =====================================================
  */

  function showAdmin(user) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");


    document
      .getElementById("userEmail")
      .innerText =
      "Logged in: " + user.email;


    loadContent();

  }


  /*
   =====================================================
   ADD CONTENT
   =====================================================
  */

  async function addContent() {

    const title =
      document.getElementById("title")
        .value.trim();

    const type =
      document.getElementById("type")
        .value;

    const body =
      document.getElementById("body")
        .value.trim();

    const file =
      document.getElementById("mediaFile")
        .files[0];


    if (!title) {

      showMessage(
        "uploadMessage",
        "Title দিন।",
        "error"
      );

      return;
    }


    /*
      Story হলে file optional।
      Image / Video হলে file প্রয়োজন।
    */

    if ((type === "image" || type === "video") && !file) {

      showMessage(
        "uploadMessage",
        "Image অথবা Video নির্বাচন করুন।",
        "error"
      );

      return;
    }


    let mediaPath = null;


    /*
     ===================================================
     FILE UPLOAD
     ===================================================
    */

    if (file) {

      const fileExtension =
        file.name.split(".").pop();

      const safeName =
        file.name
          .replace(/[^a-zA-Z0-9._-]/g, "_");

      const fileName =
        Date.now() +
        "_" +
        safeName;


      const filePath =
        fileName;


      const { error: uploadError } =
        await supabaseClient.storage
          .from("media")
          .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false
          });


      if (uploadError) {

        showMessage(
          "uploadMessage",
          "File upload failed: " +
          uploadError.message,
          "error"
        );

        return;
      }


      mediaPath = filePath;

    }


    /*
     ===================================================
     DATABASE INSERT
     ===================================================
    */

    const { error: dbError } =
      await supabaseClient
        .from("content")
        .insert({

          title: title,

          type: type,

          body: body || null,

          media_path: mediaPath,

          published: true

        });


    if (dbError) {

      /*
        Database insert failed হলে
        uploaded file delete করার চেষ্টা
      */

      if (mediaPath) {

        await supabaseClient
          .storage
          .from("media")
          .remove([mediaPath]);

      }


      showMessage(
        "uploadMessage",
        "Database error: " +
        dbError.message,
        "error"
      );

      return;
    }


    /*
     ===================================================
     SUCCESS
     ===================================================
    */

    showMessage(
      "uploadMessage",
      "✅ Content successfully published!",
      "success"
    );


    document.getElementById("title").value = "";
    document.getElementById("body").value = "";
    document.getElementById("mediaFile").value = "";


    loadContent();

  }


  /*
   =====================================================
   LOAD CONTENT
   =====================================================
  */

  async function loadContent() {

    const list =
      document.getElementById("contentList");


    list.innerHTML = "Loading...";


    const { data, error } =
      await supabaseClient
        .from("content")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      list.innerHTML =
        `<div class="status error">
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        `<div class="status">
          এখনো কোনো content নেই।
        </div>`;

      return;
    }


    list.innerHTML = "";


    data.forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        "content-item";


      let mediaHTML = "";


      /*
       =================================================
       PUBLIC FILE URL
       =================================================
      */

      if (item.media_path) {

        const { data: publicData } =
          supabaseClient.storage
            .from("media")
            .getPublicUrl(item.media_path);


        const url =
          publicData.publicUrl;


        if (item.type === "image") {

          mediaHTML =
            `<img
              src="${url}"
              alt=""
            >`;

        }


        if (item.type === "video") {

          mediaHTML =
            `<video
              controls
              src="${url}"
            ></video>`;

        }

      }


      div.innerHTML = `

        <h3>
          ${escapeHtml(item.title)}
        </h3>

        <p>
          <strong>Type:</strong>
          ${escapeHtml(item.type)}
        </p>

        <p>
          ${escapeHtml(item.body || "")}
        </p>

        ${mediaHTML}

        <p>
          <strong>Status:</strong>
          ${item.published ? "🟢 Published" : "🔴 Unpublished"}
        </p>

        <button
          class="secondary"
          onclick="togglePublish(${item.id}, ${item.published})"
        >
          ${item.published ? "Unpublish" : "Publish"}
        </button>

        <button
          class="danger"
          onclick="deleteContent(${item.id}, '${escapeJs(item.media_path || "")}')"
        >
          🗑️ Delete
        </button>

      `;


      list.appendChild(div);

    });

  }


  /*
   =====================================================
   PUBLISH / UNPUBLISH
   =====================================================
  */

  async function togglePublish(id, currentStatus) {

    const { error } =
      await supabaseClient
        .from("content")
        .update({
          published: !currentStatus
        })
        .eq("id", id);


    if (error) {

      alert(
        "Update failed: " +
        error.message
      );

      return;
    }


    loadContent();

  }


  /*
   =====================================================
   DELETE
   =====================================================
  */

  async function deleteContent(id, mediaPath) {

    const ok =
      confirm(
        "এই content সত্যিই delete করতে চান?"
      );


    if (!ok) return;


    /*
      Database থেকে delete
    */

    const { error } =
      await supabaseClient
        .from("content")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;
    }


    /*
      Storage file delete
    */

    if (mediaPath) {

      await supabaseClient
        .storage
        .from("media")
        .remove([mediaPath]);

    }


    loadContent();

  }


  /*
   =====================================================
   CHECK EXISTING LOGIN
   =====================================================
  */

  async function checkSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (session && session.user) {

      showAdmin(session.user);

    }

  }


  /*
   =====================================================
   MESSAGE
   =====================================================
  */

  function showMessage(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(elementId);


    element.innerHTML =
      `<div class="status ${type}">
        ${escapeHtml(message)}
      </div>`;

  }


  /*
   =====================================================
   SECURITY HELPERS
   =====================================================
  */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /*
   =====================================================
   START
   =====================================================
  */

  checkSession();

</script>

</body>
</html>
